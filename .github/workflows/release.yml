name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore JtdxAutoResume.V3.csproj

      - name: Verify release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content JtdxAutoResume.V3.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag does not match the application version $version."
          }

      - name: Run setup wizard smoke tests
        run: dotnet run -c Release --project Tests\SetupWizard.SmokeTests\SetupWizard.SmokeTests.csproj

      - name: Run application smoke tests
        run: dotnet run -c Release --project Tests\ConfigurableRows.SmokeTests\JtdxAutoResume.ConfigurableRows.SmokeTests.csproj

      - name: Run map smoke tests
        run: dotnet run -c Release --project Tests\Map.SmokeTests\Map.SmokeTests.csproj

      - name: Run receive-only Scavenger smoke tests
        run: dotnet run -c Release --project Tests\Scavenger.SmokeTests\Scavenger.SmokeTests.csproj

      - name: Run Achievements smoke tests
        run: dotnet run -c Release --project Tests\Achievements.SmokeTests\Achievements.SmokeTests.csproj

      - name: Verify layout and unchanged protected logic
        run: dotnet run -c Release --project Tests\Presentation.SmokeTests\Presentation.SmokeTests.csproj

      - name: Shut down build servers
        run: dotnet build-server shutdown

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishOutput = & dotnet publish JtdxAutoResume.V3.csproj `
            -c GitHubRelease `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:UseSharedCompilation=false `
            -o "$env:RUNNER_TEMP\dxpilot-publish" 2>&1
          $publishExitCode = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Host $_ }
          if ($publishExitCode -ne 0) {
            $diagnostic = ($publishOutput | Select-Object -Last 30) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=dotnet publish failed::$diagnostic"
            exit $publishExitCode
          }
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\dxpilot-publish" -Filter *.pdb -File -Recurse |
            Remove-Item -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $manualPdf = Get-ChildItem -LiteralPath manuals -Filter "DX_Pilot_for_JTDX_User_Manual_*.pdf" -File |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $manualPdf) {
            throw "The illustrated DX Pilot PDF user manual is missing."
          }
          Copy-Item -LiteralPath $manualPdf.FullName `
            -Destination "$env:RUNNER_TEMP\dxpilot-publish\DX-Pilot-User-Manual.pdf" -Force
          foreach ($guide in @('Layout-Preview-Guide.md', 'Scavenger-Preview-Guide.md', 'Achievements-Preview-Guide.md', "Release-$env:GITHUB_REF_NAME.md")) {
            Copy-Item -LiteralPath "manuals\$guide" -Destination "$env:RUNNER_TEMP\dxpilot-publish\$guide"
          }
          $zip = "artifacts\DXPilot-for-JTDX-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\dxpilot-publish\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manualPdf = Get-ChildItem -LiteralPath manuals -Filter "DX_Pilot_for_JTDX_User_Manual_*.pdf" -File |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $manualDocx = Get-ChildItem -LiteralPath manuals -Filter "DX_Pilot_for_JTDX_User_Manual_*.docx" -File |
            Sort-Object Name -Descending |
            Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ZIP "$env:RELEASE_ZIP.sha256" $manualPdf.FullName $manualDocx.FullName `
            --title "DX Pilot for JTDX $env:GITHUB_REF_NAME" `
            --notes-file "manuals/Release-$env:GITHUB_REF_NAME.md" --verify-tag --latest
