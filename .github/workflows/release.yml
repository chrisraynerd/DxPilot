name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore JtdxAutoResume.V3.csproj

      - name: Run setup wizard smoke tests
        run: dotnet run -c Release --project Tests\SetupWizard.SmokeTests\SetupWizard.SmokeTests.csproj

      - name: Run application smoke tests
        run: dotnet run -c Release --project Tests\ConfigurableRows.SmokeTests\JtdxAutoResume.ConfigurableRows.SmokeTests.csproj

      - name: Shut down build servers
        run: dotnet build-server shutdown

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          $publishOutput = & dotnet publish JtdxAutoResume.V3.csproj `
            -c GitHubRelease `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:UseSharedCompilation=false `
            -o "$env:RUNNER_TEMP\dxpilot-publish" 2>&1
          $publishExitCode = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Host $_ }
          if ($publishExitCode -ne 0) {
            $diagnostic = ($publishOutput | Select-Object -Last 30) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=dotnet publish failed::$diagnostic"
            exit $publishExitCode
          }

      - name: Create release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $zip = "artifacts\DXPilot-for-JTDX-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\dxpilot-publish\*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ZIP `
            --title "DX Pilot for JTDX $env:GITHUB_REF_NAME" `
            --generate-notes
